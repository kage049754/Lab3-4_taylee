name: Build Mini Store

on:
  push:
    branches: [main, lab4-live-search]
  pull_request:
    branches: [main, lab4-live-search]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build production app
        run: npm run build