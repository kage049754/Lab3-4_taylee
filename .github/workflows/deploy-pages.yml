name: Deploy Lab 3 and Lab 4 to GitHub Pages

on:
  push:
    branches: [main, lab4-live-search]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lab 3
        uses: actions/checkout@v4
        with:
          ref: main
          path: source/lab3

      - name: Checkout Lab 4
        uses: actions/checkout@v4
        with:
          ref: lab4-live-search
          path: source/lab4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Lab 3
        working-directory: source/lab3
        run: |
          npm install
          npm run build -- --base=/Lab3-4/lab3/
          mkdir -p ../../public/lab3
          cp -R dist/. ../../public/lab3/

      - name: Build Lab 4
        working-directory: source/lab4
        run: |
          npm install
          npm run build -- --base=/Lab3-4/lab4/
          mkdir -p ../../public/lab4
          cp -R dist/. ../../public/lab4/

      - name: Create landing page
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>DCIT26 Laboratory Exercises 3 and 4</title>
            <style>
              * { box-sizing: border-box; }
              body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; background: #f4f7f2; color: #183b2b; }
              main { width: min(680px, 100%); padding: 36px; border-radius: 22px; background: white; box-shadow: 0 16px 50px #183b2b18; }
              h1 { margin-top: 0; }
              p { color: #52665a; line-height: 1.6; }
              nav { display: grid; gap: 14px; margin-top: 26px; }
              a { display: block; padding: 18px 20px; border-radius: 14px; background: #e8f1e9; color: #17452f; text-decoration: none; font-weight: 700; }
              a:hover { background: #d8e9db; }
              small { display: block; margin-top: 6px; color: #52665a; font-weight: 400; }
            </style>
          </head>
          <body>
            <main>
              <h1>DCIT26 Mini Store</h1>
              <p>Select the laboratory exercise you want to open.</p>
              <nav>
                <a href="./lab3/">Laboratory Exercise 3<small>React Props and Component Communication</small></a>
                <a href="./lab4/">Laboratory Exercise 4<small>React useState and useEffect — Live Search</small></a>
              </nav>
            </main>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
